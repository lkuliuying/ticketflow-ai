[project]
name = "ticketflow-ai-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1,<1",
    "httpx==0.28.1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt>=2.15.1,<3",
    "redis>=8.1,<9",
    "uvicorn>=0.53,<1",
]

[dependency-groups]
dev = ["mypy>=2.3,<3", "pytest>=9,<10", "ruff>=0.16,<1"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real test Redis"]
