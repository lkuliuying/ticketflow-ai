name: FastAPI Service

on:
  push:
    paths:
      - 'service-fastapi/**'
      - '.github/workflows/service-fastapi.yml'
  pull_request:
    paths:
      - 'service-fastapi/**'
      - '.github/workflows/service-fastapi.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: service-fastapi

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTH_TEST_REDIS_URL: redis://127.0.0.1:56379/1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: service-fastapi/uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m pytest -q
