name: Gateway test project

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'deploy/**'
      - 'backend-drf/tickets/**'
      - 'backend-drf/knowledge/**'
      - 'service-fastapi/**'
      - '.github/workflows/gateway-tests.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'deploy/**'
      - 'backend-drf/tickets/**'
      - 'backend-drf/knowledge/**'
      - 'service-fastapi/**'
      - '.github/workflows/gateway-tests.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: tests/uv.lock
      - run: uv lock --check
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .

  gateway-acceptance:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: tests/uv.lock
      - name: Start Mock delivery stack and seed demo accounts
        run: |
          python deploy/local.py env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build --wait --wait-timeout 240
          python deploy/local.py seed
      - name: Run black-box gateway acceptance tests
        working-directory: tests
        run: |
          uv sync --locked
          uv run --locked pytest -q -s
      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v
