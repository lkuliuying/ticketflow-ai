name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - 'backend-drf/docs/schema/**'
      - 'backend-drf/**/seeds/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - 'backend-drf/docs/schema/**'
      - 'backend-drf/**/seeds/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XADMIN_SERVER_DIR: ${{ github.workspace }}/backend-drf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test:run

      - name: Typecheck & lint
        run: |
          pnpm typecheck
          pnpm lint

      # bundle-size 与 entry-closure 门禁读取 dist/ 产物，构建必须先于门禁
      - name: Production build
        run: pnpm build

      - name: Run repository gates
        run: |
          for g in bundle-size entry-closure success-code platform-config i18n as-unknown hook-length \
                   font-size-literals color-literals module-cycles contract contract-usage menu-permissions \
                   version quarantine template-root forms; do
            pnpm check:$g
          done
          node scripts/check-file-length.mjs
