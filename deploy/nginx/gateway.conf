resolver 127.0.0.11 valid=10s ipv6=off;

upstream ticketflow_drf {
    zone ticketflow_drf 64k;
    server drf-web:8896 resolve;
}

upstream ticketflow_ai {
    zone ticketflow_ai 64k;
    server ai:8897 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";

    location ~ ^/api/tickets/[^/]+/ai-context/?$ {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }

    location /api/ {
        proxy_pass http://ticketflow_drf;
    }

    location = /api-docs {
        return 404;
    }

    location ^~ /api-docs/ {
        return 404;
    }

    location /media/ {
        proxy_pass http://ticketflow_drf;
    }

    location /ws/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://ticketflow_drf;
    }

    location /ai/ {
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_pass http://ticketflow_ai;
    }

    location / {
        gzip on;
        gzip_static on;
        gzip_min_length 1k;
        gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
        try_files $uri $uri/ /index.html;
    }
}
