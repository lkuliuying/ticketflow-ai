[project]
name = "ticketflow-gateway-tests"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx==0.28.1", "websockets>=15,<17"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<1"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["."]
